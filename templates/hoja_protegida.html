<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Documento Protegido</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; user-select: none; -webkit-user-select: none; }
        @media print { body { display: none !important; } }
        .documento { border: 1px solid #ccc; padding: 30px; background: #fafafa; border-radius: 6px; }
    </style>
</head>
<body oncontextmenu="return false;">
    <div class="documento">
        <h1>Material Oficial: {{ curso }} - Año {{ anio }}</h1>
        <p>Este contenido está protegido. Tu acceso estará activo durante 30 días.</p>
        <hr>
        <p>Aquí se muestra el examen o documento de <strong>{{ curso }} ({{ anio }})</strong>.</p>
    </div>
</body>
</html>
